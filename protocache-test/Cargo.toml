[package]
name = "protocache-test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
flatbuffers-bench = ["dep:flatbuffers"]
fory-bench = ["dep:fory", "dep:fory-core", "dep:fory-derive"]

[dependencies]
# Benchmark-only dependencies. This crate is never published.
flatbuffers = { version = "=25.12.19", optional = true }
fory = { version = "=1.4.0", optional = true }
fory-core = { version = "=1.4.0", optional = true }
fory-derive = { version = "=1.4.0", optional = true }
mimalloc = { version = "0.1", default-features = false }
prost = "0.13.5"
prost-reflect = "0.15.0"
protocache-core = { version = "1.0.0", path = "../protocache-core" }
protocache-extension = { version = "1.0.0", path = "../protocache-extension", features = ["native-proto"] }

[build-dependencies]
prost = "0.13.5"
prost-build = "0.13.5"
prost-reflect = { version = "0.15.0", features = ["serde"] }
prost-types = "0.13.5"
protocache-extension = { version = "1.0.0", path = "../protocache-extension" }
