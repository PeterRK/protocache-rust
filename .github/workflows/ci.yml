name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Test, lint, and docs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native test dependencies
        run: sudo apt-get update

      - name: Install protobuf and benchmark tools
        run: >
          sudo apt-get install --yes
          libprotobuf-dev
          libprotoc-dev
          protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test default extension boundary
        run: cargo test -p protocache-extension --no-default-features --locked

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Build generator
        run: cargo build -p protoc-gen-pcrs --locked

      - name: Test freshly generated bindings
        run: PROTOC_GEN_PCRS="$PWD/target/debug/protoc-gen-pcrs" cargo test -p protocache-test --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
